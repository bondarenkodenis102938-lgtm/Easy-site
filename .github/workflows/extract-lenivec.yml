name: Extract Lenivec project

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        shell: python
        run: |
          import os
          import zipfile

          zip_path = "Lenivec-full-project.zip"

          with zipfile.ZipFile(zip_path) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  if not name or name.endswith("/"):
                      continue
                  safe = os.path.normpath(name)
                  if safe.startswith("..") or os.path.isabs(safe):
                      raise SystemExit(f"Unsafe path: {name}")
                  os.makedirs(os.path.dirname(safe) or ".", exist_ok=True)
                  with z.open(info) as src, open(safe, "wb") as dst:
                      dst.write(src.read())

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src schema.sql wrangler.toml
          git diff --cached --quiet || git commit -m "Extract Lenivec project files"
          git push
