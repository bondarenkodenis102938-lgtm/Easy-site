<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Lenivec — мой простой сайт с публичными постами, фотографиями и видео.">
  <title>Lenivec</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #d5d5d5;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 26px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 4px;
      color: #666;
      font-size: 14px;
    }

    .version-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 8px;
      background: #eeeeee;
      border: 1px solid #cccccc;
      border-radius: 4px;
      color: #555;
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-button {
      display: inline-block;
      padding: 9px 14px;
      background: #fff;
      color: #222;
      border: 1px solid #999;
      border-radius: 4px;
      font: inherit;
      cursor: pointer;
    }

    .refresh-button:hover {
      background: #eee;
    }

    .admin-link {
      display: inline-block;
      padding: 9px 14px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .admin-link:hover {
      background: #444;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .post {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .post-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .post-author {
      color: #555;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .post-text {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 16px;
    }

    img,
    video {
      display: block;
      max-width: 100%;
      margin-top: 18px;
      border-radius: 4px;
    }

    video {
      width: 100%;
    }

    .youtube-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 18px;
      background: #000;
    }

    .youtube-player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .youtube-start {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: #000;
      cursor: pointer;
    }

    .youtube-start img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .youtube-start span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      background: rgba(0,0,0,.75);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 4px;
    }

    .empty,
    .error {
      background: white;
      padding: 25px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .error {
      color: #9b0000;
    }

    .post-actions {
      margin-top: 16px;
    }

    .share-button {
      padding: 9px 14px;
      background: #fff;
      color: #222;
      border: 1px solid #999;
      border-radius: 4px;
      font: inherit;
      cursor: pointer;
    }

    .share-button:hover,
    .post-link:hover {
      background: #eee;
    }

    .post-link {
      display: inline-block;
      margin-right: 8px;
      padding: 9px 14px;
      background: #fff;
      color: #222;
      border: 1px solid #999;
      border-radius: 4px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 15px;
      }

      main {
        margin-top: 20px;
        padding: 0 12px;
      }

      .post {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">Lenivec</div>
      <div class="subtitle">Мой простой сайт.</div>
      <div class="version-badge">Версия 1.1 · SHARE</div>
    </div>

    <div class="header-actions"><button id="refreshBtn" class="refresh-button">Обновить</button><a class="admin-link" href="/admin">Админка</a><a class="admin-link" href="/kino">КИНО</a></div>
  </div>
</header>

<main>
  <div id="posts">
    <div class="empty">Загрузка...</div>
  </div>
</main>

<script>
function youtubeId(value) {
  try {
    const url = new URL(value);
    let id = "";

    if (url.hostname === "youtu.be" || url.hostname === "www.youtu.be") {
      id = url.pathname.slice(1).split("/")[0];
    } else if (
      url.hostname === "youtube.com" ||
      url.hostname === "www.youtube.com" ||
      url.hostname === "m.youtube.com"
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else if (url.pathname.startsWith("/shorts/")) {
        id = url.pathname.slice("/shorts/".length).split("/")[0];
      } else if (url.pathname.startsWith("/embed/")) {
        id = url.pathname.slice("/embed/".length).split("/")[0];
      }
    }

    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : "";
  } catch {
    return "";
  }
}

function youtubeEmbedUrl(value) {
  try {
    const url = new URL(value);

    let id = "";

    if (url.hostname === "youtu.be" || url.hostname === "www.youtu.be") {
      id = url.pathname.slice(1).split("/")[0];
    } else if (
      url.hostname === "youtube.com" ||
      url.hostname === "www.youtube.com" ||
      url.hostname === "m.youtube.com"
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else if (url.pathname.startsWith("/shorts/")) {
        id = url.pathname.slice("/shorts/".length).split("/")[0];
      } else if (url.pathname.startsWith("/embed/")) {
        id = url.pathname.slice("/embed/".length).split("/")[0];
      }
    }

    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
      return "about:blank";
    }

    return "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?controls=1&playsinline=1&rel=0";
  } catch {
    return "about:blank";
  }
}

async function loadPosts() {
  const container = document.getElementById("posts");

  try {
    const response = await fetch("/api/posts", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API error");
    }

    const list = await response.json();

    container.innerHTML = "";

    if (!Array.isArray(list) || list.length === 0) {
      container.innerHTML =
        '<div class="empty">Пока ничего нет.</div>';
      return;
    }

    for (const post of list) {
      const article = document.createElement("article");
      article.className = "post";

      const date = document.createElement("div");
      date.className = "post-date";

      const timestamp = Number(post.createdAt);

      if (Number.isFinite(timestamp)) {
        date.textContent =
          new Date(timestamp).toLocaleString("ru-RU");
      } else {
        date.textContent = "";
      }

      const author = document.createElement("div");
      author.className = "post-author";
      author.textContent = "Опубликовал: Lenivec";

      const text = document.createElement("div");
      text.className = "post-text";
      text.textContent = post.body || "";

      article.appendChild(date);
      article.appendChild(author);
      article.appendChild(text);

      const actions = document.createElement("div");
      actions.className = "post-actions";

      if (post.youtubeUrl) {
        const wrap = document.createElement("div");
        wrap.className = "youtube-wrap";

        const button = document.createElement("button");
        button.className = "youtube-start";
        button.type = "button";

        const image = document.createElement("img");
        image.src = "https://i.ytimg.com/vi/" +
          encodeURIComponent(youtubeId(post.youtubeUrl)) +
          "/hqdefault.jpg";
        image.alt = "Превью YouTube видео";

        const label = document.createElement("span");
        label.textContent = "▶ Смотреть";

        button.appendChild(image);
        button.appendChild(label);

        button.addEventListener("click", () => {
          const iframe = document.createElement("iframe");
          iframe.className = "youtube-player";
          iframe.src = youtubeEmbedUrl(post.youtubeUrl);
          iframe.title = "YouTube видео";
          iframe.frameBorder = "0";
          iframe.allowFullscreen = true;

          wrap.innerHTML = "";
          wrap.appendChild(iframe);
        });

        wrap.appendChild(button);
        article.appendChild(wrap);

        const youtubeLink = document.createElement("a");
        youtubeLink.className = "post-link";
        youtubeLink.href = post.youtubeUrl;
        youtubeLink.target = "_blank";
        youtubeLink.rel = "noopener";
        youtubeLink.textContent = "Открыть на YouTube";
        actions.appendChild(youtubeLink);
      }

      if (post.mediaUrl && post.mediaType === "image") {
        const image = document.createElement("img");
        image.src = post.mediaUrl;
        image.alt = "";
        image.loading = "lazy";
        article.appendChild(image);
      }

      if (post.mediaUrl && post.mediaType === "video") {
        const video = document.createElement("video");
        video.src = post.mediaUrl;
        video.controls = true;
        video.preload = "metadata";
        article.appendChild(video);
      }

      async function shareLink(url, button, successText, shareText) {
        try {
          if (navigator.share) {
            await navigator.share({
              title: "Lenivec",
              text: shareText || "Lenivec",
              url
            });
          } else {
            await navigator.clipboard.writeText(url);
            button.textContent = successText;
            setTimeout(() => {
              button.textContent = button.dataset.originalText;
            }, 2000);
          }
        } catch (error) {}
      }

      const shareButton = document.createElement("button");
      shareButton.className = "share-button";
      shareButton.dataset.originalText = "Поделиться постом";
      shareButton.textContent = "Поделиться постом";

      shareButton.onclick = () => {
        const shareUrl =
          location.origin + "/post/" + encodeURIComponent(post.id);

        return shareLink(
          shareUrl,
          shareButton,
          "Ссылка скопирована!",
          "Пост Lenivec"
        );
      };

      actions.appendChild(shareButton);

      if (post.mediaUrl && post.mediaType === "image") {
        const photoButton = document.createElement("button");
        photoButton.className = "share-button";
        photoButton.dataset.originalText = "Поделиться фото";
        photoButton.textContent = "Поделиться фото";

        photoButton.onclick = () => {
          const photoUrl =
            new URL(post.mediaUrl, location.origin).href;

          return shareLink(
            photoUrl,
            photoButton,
            "Ссылка на фото скопирована!",
            "Фото из Lenivec"
          );
        };

        actions.appendChild(photoButton);
      }

      if (post.mediaUrl && post.mediaType === "video") {
        const videoButton = document.createElement("button");
        videoButton.className = "share-button";
        videoButton.dataset.originalText = "Поделиться видео";
        videoButton.textContent = "Поделиться видео";

        videoButton.onclick = () => {
          const videoUrl =
            new URL(post.mediaUrl, location.origin).href;

          return shareLink(
            videoUrl,
            videoButton,
            "Ссылка на видео скопирована!",
            "Видео из Lenivec"
          );
        };

        actions.appendChild(videoButton);
      }

      if (post.mediaUrl) {
        const mediaLink = document.createElement("a");
        mediaLink.className = "post-link";
        mediaLink.href = post.mediaUrl;
        mediaLink.target = "_blank";
        mediaLink.rel = "noopener";
        mediaLink.textContent =
          post.mediaType === "image"
            ? "Открыть фото"
            : "Открыть видео";

        actions.appendChild(mediaLink);
      }

      article.appendChild(actions);

      container.appendChild(article);
    }

  } catch (error) {
    container.innerHTML =
      '<div class="error">Не удалось загрузить записи.</div>';
  }
}

document.getElementById("refreshBtn").addEventListener("click", () => {
  loadPosts();
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Backspace") {
    return;
  }

  const target = event.target;
  const isEditable =
    target instanceof HTMLInputElement ||
    target instanceof HTMLTextAreaElement ||
    target instanceof HTMLSelectElement ||
    target?.isContentEditable;

  if (isEditable || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
    return;
  }

  if (history.length > 1) {
    history.back();
  }
});

loadPosts();
</script>

</body>
</html>
